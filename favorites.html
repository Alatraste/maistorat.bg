<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Любими | Майстора.bg</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    color:#333;
}

header{
    background:white;
    padding:20px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid #4da6df;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.logo span{
    color:#4da6df;
}

.back{
    text-decoration:none;
    color:#4da6df;
    font-weight:bold;
}

main{
    width:88%;
    margin:40px auto;
}

h1{
    border-bottom:2px solid #4da6df;
    padding-bottom:12px;
}

#favorites{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:30px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    background:white;
    border-radius:8px;
    font-size:20px;
    color:#777;
}

@media(max-width:900px){
    #favorites{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    #favorites{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">МАЙСТОРА<span>.BG</span></div>
    <a class="back" href="index.html">← Към магазина</a>
</header>

<main>
    <h1>♥ Моите любими</h1>

    <div id="favorites">
        <div class="empty">
            Все още нямате добавени любими продукти.
        </div>
    </div>
</main>
<script>
const favoritesBox = document.getElementById('favorites');
let found = false;

favoritesBox.innerHTML = '';

for (let i = 0; i < 100; i++) {
    const product = localStorage.getItem('favorite-product-' + i);

    if (product) {
        favoritesBox.insertAdjacentHTML('beforeend', product);
        found = true;
    }
}

if (!found) {
    favoritesBox.innerHTML =
        '<div class="empty">Все още нямате добавени любими продукти.</div>';
}
</script>
</body>
</html>
