<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Любими | Майстора.bg</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    color:#333;
}

header{
    background:white;
    padding:20px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid #4da6df;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.logo span{
    color:#4da6df;
}

.back{
    text-decoration:none;
    color:#4da6df;
    font-weight:bold;
}

main{
    width:88%;
    margin:40px auto;
}

h1{
    border-bottom:2px solid #4da6df;
    padding-bottom:12px;
}

#favorites{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:30px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    background:white;
    border-radius:8px;
    font-size:20px;
    color:#777;
}
  #favorites{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:25px;
}

@media(max-width:900px){
    #favorites{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    #favorites{
        grid-template-columns:1fr;
    }
}
  
.product{
    position:relative;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.product-image{
    height:160px;
    background:#f3f4f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    border-radius:7px;
    margin-bottom:12px;
}

.product h3{
    font-size:16px;
    min-height:40px;
    margin:10px 0;
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#4f75c9;
    color:white;
    padding:5px 9px;
    border-radius:4px;
    font-size:12px;
}

.favorite{
    position:absolute;
    top:10px;
    right:10px;
    border:0;
    background:transparent;
    color:#55b9e8;
    font-size:25px;
    cursor:pointer;
}

.old-price{
    text-decoration:line-through;
    color:#777;
    font-size:14px;
}

.price{
    color:#4f75c9;
    font-size:21px;
    font-weight:bold;
    margin:5px 0 10px;
}

.product > button:not(.favorite){
    width:100%;
    border:0;
    border-radius:4px;
    padding:10px;
    background:#4f75c9;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:900px){
    #favorites{
        grid-template-columns:repeat(2,1fr);
    }
}
    header{
    background:#1593e6;
    border-bottom:none;
}

.logo{
    color:#000;
}

.logo span{
    color:#000;
}

.back{
    color:#000;
}
</style>
</head>

<body>

<header>
    <div class="logo">МАЙСТОРА<span>.BG</span></div>
    <a class="back" href="index.html">← Към магазина</a>
</header>

<main>
    <h1>♥ Моите любими</h1>

    <div id="favorites">
        <div class="empty">
            Все още нямате добавени любими продукти.
        </div>
    </div>
</main>
<script>
const favoritesBox = document.getElementById('favorites');
let found = false;

favoritesBox.innerHTML = '';

for (let i = 0; i < 100; i++) {
    const product = localStorage.getItem('favorite-product-' + i);

    if (product) {
        favoritesBox.insertAdjacentHTML('beforeend', product);
        found = true;

        const addedProduct = favoritesBox.lastElementChild;
        const heart = addedProduct.querySelector('.favorite');

        if (heart) {
            heart.textContent = '♥';

            heart.addEventListener('click', function () {
                localStorage.removeItem('favorite-product-' + i);
                localStorage.setItem('favorite-' + i, 'false');
                addedProduct.remove();

                if (favoritesBox.children.length === 0) {
                    favoritesBox.innerHTML =
                        '<div class="empty">Все още нямате добавени любими продукти.</div>';
                }
            });
        }
    }
}

if (!found) {
    favoritesBox.innerHTML =
        '<div class="empty">Все още нямате добавени любими продукти.</div>';
}
</script>
</body>
</html>
