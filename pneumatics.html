<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">

<title>Пневматика | Майстора.bg</title>
<link rel="stylesheet" href="styles/machine-categories.css">
<style>
.pneumatics-grid{width:min(1200px,calc(100% - 40px));grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}

.pneumatics-grid .image-placeholder{border-bottom:1px solid #eee}
.pneumatics-grid .image-tile h2{font-size:18px;padding:15px 8px;min-height:64px}
@media(max-width:900px){.pneumatics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.pneumatics-grid{grid-template-columns:1fr;width:min(100% - 28px,1200px)}}

</head>
<body>
<div id="header-container"></div>
<section class="page-title"><h1>Пневматика</h1><p>Категории</p></section>
<main class="tile-grid image-tiles pneumatics-grid">
<a class="tile image-tile" href="pneumatics-hoses.html"><div class="image-placeholder" aria-label="Място за снимка: Маркучи"></div><h2>Маркучи</h2></a>
<a class="tile image-tile" href="pneumatics-fittings.html"><div class="image-placeholder" aria-label="Място за снимка: Фитинги и връзки"></div><h2>Фитинги и връзки</h2></a>
<a class="tile image-tile" href="pneumatics-regulators-lubricators.html"><div class="image-placeholder" aria-label="Място за снимка: Регулатори и омаслители"></div><h2>Регулатори и омаслители</h2></a>
<a class="tile image-tile" href="pneumatics-pressure-gauges.html"><div class="image-placeholder" aria-label="Място за снимка: Манометри"></div><h2>Манометри</h2></a>
</main>
<div id="footer-container"></div>
<script>Promise.all([fetch('header.html').then(r=>r.text()).then(h=>document.getElementById('header-container').innerHTML=h),fetch('footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-container').innerHTML=h)]);</script>
</body>
</html>
