<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Батерии и зарядни | Майстора.bg</title>
<link rel="stylesheet" href="styles/machine-categories.css">
<style>
.batteries-grid{width:min(1100px,calc(100% - 40px));grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.batteries-grid .image-tile img,.batteries-grid .image-placeholder{width:100%;height:220px;display:block;background:#fff;padding:10px}
.batteries-grid .image-placeholder{border-bottom:1px solid #eee}
.batteries-grid .image-tile h2{font-size:18px;padding:15px 8px;min-height:64px}
@media(max-width:900px){.batteries-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.batteries-grid{grid-template-columns:1fr;width:min(100% - 28px,1100px)}}
</style>
</head>
<body>
<div id="header-container"></div>
<section class="page-title"><h1>Батерии и зарядни</h1><p>Категории</p></section>
<main class="tile-grid image-tiles batteries-grid">
<a class="tile image-tile" href="batteries.html"><div class="image-placeholder" aria-label="Място за снимка: Батерии"></div><h2>Батерии</h2></a>
<a class="tile image-tile" href="chargers.html"><div class="image-placeholder" aria-label="Място за снимка: Зарядни устройства"></div><h2>Зарядни устройства</h2></a>
<a class="tile image-tile" href="battery-charger-kits.html"><div class="image-placeholder" aria-label="Място за снимка: Комплекти"></div><h2>Комплекти</h2></a>
</main>
<div id="footer-container"></div>
<script>Promise.all([fetch('header.html').then(r=>r.text()).then(h=>document.getElementById('header-container').innerHTML=h),fetch('footer.html').then(r=>r.text()).then(h=>document.getElementById('footer-container').innerHTML=h)]);</script>
</body>
</html>
