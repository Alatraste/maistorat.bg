
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марки | Майстора.bg</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* СТРАНИЦА МАРКИ */

.brands-section {
    width: 100%;
    padding: 25px 30px 40px;
    background: #f5f5f5;
}

.brands-section h1 {
    font-size: 42px;
    margin: 0 0 18px;
    color: #123b5d;
}

.brands-grid {
    display: grid;
   grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

.brand-card {
    height: 105px;
    background: white;
    border: 1px solid #dddddd;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-decoration: none;
}

.brand-card img {
    display: block;
    width: 80%;
    height: 65px;
    object-fit: contain;
}
/* Уголемяване на малките лога */
.brand-card img[alt="Fischer"],
.brand-card img[alt="Metabo"],
.brand-card img[alt="Stanley"],
.brand-card img[alt="Pard"],
.brand-card img[alt="DeWalt"],
.brand-card img[alt="Mechanic"],
.brand-card img[alt="Topmaster"],
.brand-card img[alt="Premium"],
.brand-card img[alt="Raider"],
.brand-card img[alt="Pferd"],
.brand-card img[alt="MTX"],
.brand-card img[alt="Stenso"],
.brand-card img[alt="PRO M"],
.brand-card img[alt="NKG"],
.brand-card img[alt="Truper"] {
    width: 95%;
    height: 80px;
}
    /* Допълнително увеличение: Fischer, Metabo, Stanley */
.brand-card img[alt="Fischer"],
 {
    width: 100%;
    height: 90px;
}
       .brand-card img[alt="Metabo"] {
    width: 95%;
    height: 80px;
} 

.brand-card img[alt="Stanley"] {
    width: 150%;
    height: 125px;
}
        .brand-card img[alt="NKG"] {
    width: 150%;
    height: 75px;
}
        .brand-card img[alt="Bosch Professional"] {
    width: 105%;
    height: 90px;
}
        .brand-card:hover {
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    transform: translateY(-2px);
}

/* Телефон */
@media (max-width: 700px) {
    .brands-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .brands-section {
        padding: 20px 15px 30px;
    }

    .brands-section h1 {
        font-size: 32px;
    }
}
    </style>
</head>
