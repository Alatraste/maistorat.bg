
<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марки | Майстора.bg</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* СТРАНИЦА МАРКИ */

.brands-section {
    width: 100%;
    padding: 25px 30px 40px;
    background: #f5f5f5;
}

.brands-section h1 {
    font-size: 42px;
    margin: 0 0 18px;
    color: #123b5d;
}

.brands-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.brand-card {
    height: 105px;
    background: white;
    border: 1px solid #dddddd;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-decoration: none;
}

.brand-card img {
    display: block;
    max-width: 85%;
    max-height: 75px;
    object-fit: contain;
}

.brand-card:hover {
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    transform: translateY(-2px);
}

/* Телефон */
@media (max-width: 700px) {
    .brands-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .brands-section {
        padding: 20px 15px 30px;
    }

    .brands-section h1 {
        font-size: 32px;
    }
}
    </style>
</head>

<body>
